    <script>
        var price = 1.5;
        
        function recalculateOrderTotals() {
            setTimeout(function() {
                var count = $("#availableMembersMonth1 :selected").length;
                var count2 = $("#availableMembersMonth2 :selected").length;
                var count3 = $("#availableMembersMonth3 :selected").length;
                var donation = $('input[name="donationAmount"]').val() || 0;
                
                var totalItems = count + count2 + count3;
                var selectionsCount = (totalItems * price) + parseFloat(donation);
                
                $('.totalprice span').html('$' + parseFloat(selectionsCount, 10).toFixed(2).replace(/(\d)(?=(\d{3})+\.)/g, "$1,"));
            }, 50);
        }

        $('#availableMembersMonth1, #availableMembersMonth2, #availableMembersMonth3').change(recalculateOrderTotals);
        $('input[name="donationAmount"]').on('input', recalculateOrderTotals);

        $('#mobileMonthSelect').on('change', function() {
            var targetTab = $(this).val();
            $('.tab-pane').removeClass('active in fade');
            $(targetTab).addClass('active in');
            
            $('.nav-tabs li').removeClass('active');
            $('.nav-tabs a[href="' + targetTab + '"]').parent().addClass('active');
        });

        $('#availableMembersMonth1').multi({'non_selected_header': "Available Birthdays (Day)", 'selected_header': "Selected Birthdays (Day)"});
        $('#availableMembersMonth2').multi({'non_selected_header': "Available Birthdays (Day)", 'selected_header': "Selected Birthdays (Day)"});
        $('#availableMembersMonth3').multi({'non_selected_header': "Available Birthdays (Day)", 'selected_header': "Selected Birthdays (Day)"});
    </script>
